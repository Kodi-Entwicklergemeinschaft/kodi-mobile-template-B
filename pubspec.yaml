name: your_app_name
description: A new Flutter project.
version: 1.0.7+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ### Update
  upgrader: ^11.4.0

  ### Logging
  loggy: ^2.0.3
  flutter_loggy: ^2.0.3
  cupertino_icons: ^1.0.2
  sentry_flutter: ^9.0.0

  jwt_decoder: ^2.0.1

  ### l10n
  intl: ^0.20.2

  ### State Management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.1
  bloc_concurrency: ^0.2.0
  equatable: ^2.0.5
  rxdart: ^0.27.7
  provider: ^6.0.1

  ### Data
  drift: ^2.5.0
  sqlite3_flutter_libs: ^0.5.12
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  ### Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  http_parser: ^4.0.2
  http: ^1.2.1

  ### Code Generation
  freezed_annotation: ^2.2.0
  json_annotation: ^4.8.0


  ### Device Permission
  permission_handler: ^11.0.1
  url_launcher: ^6.3.0
#  connectivity: ^3.0.6
  connectivity_plus: any
  device_calendar: ^4.3.2
  device_info_plus: ^10.1.2

  ### Location
  location: ^7.0.0

  ### ui
  flutter_svprogresshud: ^1.0.1
  shimmer: ^3.0.0
  dotted_border: ^2.1.0
  font_awesome_flutter: ^10.7.0
  card_swiper: ^3.0.1
  cached_network_image: ^3.3.1
  flutter_html: ^3.0.0-beta.1
  photo_view: ^0.15.0
  carousel_slider: ^5.0.0
  flutter_quill: ^11.0.0
  flutter_quill_extensions: ^11.0.0
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.0
  app_badge_plus: ^1.2.0

  webview_flutter: ^4.13.0
  flutter_widget_from_html: ^0.17.1
  fwfh_webview: ^0.15.6

  ### Firebase
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1

  ### Matomo
  matomo_tracker: ^5.1.0
  ### File Reading
  image_picker: ^1.2.0
  # flutter_slidable: ^3.1.1
  flutter_slidable: ^4.0.0
  file_picker: ^8.0.5
  flutter_pdfview: ^1.4.0
  flutter_cached_pdfview: ^0.4.3
  flutter_cache_manager: ^3.4.1
  comment_box: ^0.0.18
  comment_tree: ^0.3.0
  path_provider: ^2.0.9
  # multiple_images_picker: ^1.0.1
  html: ^0.15.4
  calendar_date_picker2: ^1.1.5
  package_info_plus: ^8.3.0
  flutter_dotenv: ^5.1.0
  table_calendar: ^3.0.9
  flutter_typeahead: ^4.0.0
  shared_preferences: ^2.2.3
  pointycastle: ^3.6.2
  rsa_encrypt: ^2.0.0
  encrypt: ^5.0.3
  web_socket_channel: ^2.1.0
  flutter_secure_storage: ^9.2.2
  fast_rsa: ^3.6.3
# Image cropper
  image_cropper: ^9.1.0
# Mutiple drop down selector
  multi_dropdown: ^3.0.1

 # General dependencies
  uuid: ^4.5.1
  html2md: ^1.3.2
  open_file: ^3.5.10
  firebase_remote_config: ^6.0.1


dependency_overrides:
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  retrofit_generator: ^8.1.0

  freezed: ^2.3.2
  json_serializable: ^6.6.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  curl_logger_dio_interceptor: ^1.0.0
  dartz: ^0.10.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "path/to/image.png"

flutter:
  assets:
    - assets/images/
    - assets/locale/
    - assets/data/
    - shorebird.yaml

  fonts:
